<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepgram Aura-2 TTS</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 100vh; }
        h1 { color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .container { background: rgba(255,255,255,0.15); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); max-width: 900px; margin: 20px auto; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        textarea { width: 90%; height: 200px; padding: 15px; font-size: 17px; border: none; border-radius: 12px; resize: vertical; background: rgba(255,255,255,0.95); color: #333; }
        select, button { padding: 14px 20px; margin: 10px; font-size: 16px; border-radius: 10px; border: none; }
        button { background: #00d4aa; color: white; cursor: pointer; font-weight: bold; }
        button:disabled { background: #666; }
        audio { margin: 25px; width: 90%; display: none; }
        #downloadLink { display: none; font-size: 18px; padding: 12px 30px; background: #ff6b6b; color: white; text-decoration: none; border-radius: 30px; }
        #status { margin: 15px; padding: 12px; border-radius: 10px; font-weight: bold; }
        .loading { background: #ffd23f; color: #333; }
        .success { background: #00d4aa; color: white; }
        .error { background: #ff6b6b; color: white; }
        .speed-control { margin: 20px; font-size: 16px; }
        .speed-control label { display: block; margin-bottom: 10px; }
        .speed-control input { width: 80%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Deepgram Aura-2 TTS Pro (Secure & Unlimited Text)</h1>
        <p>Text dài bao nhiêu cũng OK • 40+ voices • Speed control</p>
        
        <textarea id="text" placeholder="Dán script dài ở đây...">Xin chào mọi người!</textarea>
        
        <select id="model">
            <optgroup label="🇺🇸 Top American English Voices (2025)">
                <option value="aura-2-thalia-en" selected>🎤 Thalia – Female (Warm, Natural – Top YouTube)</option>
                <option value="aura-2-helena-en">🎤 Helena – Female (Friendly, Conversational)</option>
                <option value="aura-2-hera-en">🎤 Hera – Female (Professional, Clear)</option>
                <option value="aura-2-orion-en">🎤 Orion – Male (Deep, Authoritative)</option>
                <option value="aura-2-apollo-en">🎤 Apollo – Male (Energetic, Friendly)</option>
                <option value="aura-2-arcas-en">🎤 Arcas – Male (Calm, Narrative)</option>
                <option value="aura-2-odysseus-en">🎤 Odysseus – Male (Classic, Deep – Perfect for drama!)</option>
                <option value="aura-2-zeus-en">🎤 Zeus – Male (Powerful)</option>
                <option value="aura-2-athena-en">🎤 Athena – Female (Wise)</option>
                <option value="aura-2-perseus-en">🎤 Perseus – Male (Heroic)</option>
            </optgroup>
            <optgroup label="🌍 International Voices">
                <option value="aura-2-hyperion-en">🇦🇺 Hyperion – Male (Australian)</option>
            </optgroup>
        </select>
        
        <div class="speed-control">
            <label>🚀 Tốc độ phát (Speed): <span id="speedValue">1.0x</span></label>
            <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
        
        <button id="generateBtn" onclick="generateSpeech()">🎙️ Generate Full Audio</button>
        
        <div id="status"></div>
        <audio id="audioPlayer" controls></audio>
        <br>
        <a id="downloadLink">⬇️ Download MP3 Full (Original Speed)</a>
    </div>

    <script>
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const audioPlayer = document.getElementById('audioPlayer');

        speedSlider.addEventListener('input', () => {
            const speed = speedSlider.value;
            speedValue.textContent = speed + 'x';
            if (audioPlayer.src) audioPlayer.playbackRate = speed;
        });

        async function generateSpeech() {
            const fullText = document.getElementById('text').value.trim();
            const model = document.getElementById('model').value;
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('status');
            const download = document.getElementById('downloadLink');

            audioPlayer.style.display = 'none';
            download.style.display = 'none';
            status.textContent = '';
            status.className = '';

            if (!fullText) {
                updateStatus('❌ Vui lòng nhập text!', 'error');
                return;
            }

            const chunks = chunkText(fullText, 1900);  // An toàn dưới limit 2000 ký tự
            updateStatus(`Đang xử lý ${chunks.length} chunk(s)... (${fullText.length} ký tự)`, 'loading');
            btn.disabled = true;

            const audioBlobs = [];
            for (let i = 0; i < chunks.length; i++) {
                updateStatus(`Đang generate chunk ${i+1}/${chunks.length} với giọng ${model.replace('aura-2-', '').replace('-en', '')}...`, 'loading');

                // GỌI QUA PROXY AN TOÀN (không còn key trong code)
                const response = await fetch('/api/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: chunks[i], model })
                });

                if (!response.ok) {
                    const err = await response.text();
                    updateStatus('❌ Lỗi: ' + (err || 'Unknown error'), 'error');
                    btn.disabled = false;
                    return;
                }

                const blob = await response.blob();
                audioBlobs.push(blob);
            }

            // Ghép các chunk thành file MP3 đầy đủ
            const fullBlob = new Blob(audioBlobs, { type: 'audio/mpeg' });
            const url = URL.createObjectURL(fullBlob);

            audioPlayer.src = url;
            audioPlayer.style.display = 'block';
            audioPlayer.playbackRate = speedSlider.value;
            audioPlayer.play();

            download.href = url;
            download.download = `deepgram-${model}-${Date.now()}.mp3`;
            download.style.display = 'inline-block';

            updateStatus(`✅ Thành công! Đã ghép ${chunks.length} chunk – Giọng: ${model.replace('aura-2-', '').replace('-en', '')}`, 'success');
            btn.disabled = false;
        }

        function chunkText(text, maxLength) {
            // Chia thông minh theo câu để natural hơn
            const sentences = text.match(/[^.!?]+[.!?]*/g) || [text];
            const chunks = [];
            let current = '';
            for (const sent of sentences) {
                if ((current + sent).length > maxLength) {
                    if (current) chunks.push(current.trim());
                    current = sent;
                } else {
                    current += ' ' + sent;
                }
            }
            if (current) chunks.push(current.trim());
            return chunks.filter(chunk => chunk);
        }

        function updateStatus(msg, type) {
            const s = document.getElementById('status');
            s.textContent = msg;
            s.className = type;
        }

        // Shortcut: Ctrl + Enter để generate nhanh
        document.getElementById('text').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                generateSpeech();
            }
        });
    </script>
</body>
</html>
