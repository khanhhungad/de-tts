<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepgram TTS Pro - Multi-Part + Merge All</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            min-height: 100vh; 
        }
        h1 { text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.3); margin-bottom: 10px; }
        p { text-align: center; margin-bottom: 30px; opacity: 0.9; }

        .voice-selector { text-align: center; margin-bottom: 30px; }
        .voice-selector select { padding: 12px 20px; font-size: 18px; border-radius: 10px; border: none; background: white; color: #333; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; max-width: 1400px; margin: 0 auto; }

        .part {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .part h3 { margin-top: 0; margin-bottom: 10px; text-align: center; }

        textarea { width: 100%; height: 180px; padding: 12px; font-size: 16px; border: none; border-radius: 10px; resize: vertical; background: rgba(255,255,255,0.95); color: #333; box-sizing: border-box; }

        .char-count { text-align: right; font-size: 14px; margin: 8px 0; color: #ccc; }

        button { width: 100%; padding: 14px; font-size: 17px; font-weight: bold; background: #00d4aa; color: white; border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s; }
        button:hover { background: #00b894; transform: scale(1.02); }
        button:disabled { background: #666; cursor: not-allowed; }

        .audio-section { margin-top: 15px; text-align: center; }
        audio { width: 100%; margin-top: 10px; }

        .merge-section {
            text-align: center;
            margin-top: 40px;
        }
        #mergeBtn {
            padding: 18px 60px;
            font-size: 20px;
            background: #ff6b6b;
        }
        #mergeBtn:hover { background: #ff5252; }

        #global-status { text-align: center; margin-top: 30px; font-size: 18px; padding: 12px; border-radius: 10px; min-height: 20px; }
        .loading { background: #ffd23f; color: #333; }
        .success { background: #00d4aa; }
        .error { background: #ff6b6b; }

        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>🚀 Deepgram TTS Pro - Multi-Part + Merge & Download All</h1>
    <p>6 phần riêng biệt • Generate từng phần • Sau đó nhấn "Ghép & Download All" để có 1 file MP3 duy nhất</p>

    <div class="voice-selector">
        <label for="global-model"><strong>Giọng nói chung:</strong></label><br><br>
        <select id="global-model">
            <option value="aura-2-thalia-en" selected>🎤 Thalia – Female (Warm)</option>
            <option value="aura-2-helena-en">🎤 Helena – Female (Friendly)</option>
            <option value="aura-2-hera-en">🎤 Hera – Female (Professional)</option>
            <option value="aura-2-orion-en">🎤 Orion – Male (Deep)</option>
            <option value="aura-2-apollo-en">🎤 Apollo – Male (Energetic)</option>
            <option value="aura-2-odysseus-en">🎤 Odysseus – Male (Classic, Drama)</option>
        </select>
    </div>

    <div class="grid">
        <!-- 6 phần giống bản trước -->
        <!-- (Mình giữ nguyên cấu trúc 6 phần như bản trước để ngắn gọn, anh copy từ bản cũ vào đây hoặc dùng code đầy đủ mình gửi trước) -->
        <!-- Phần 1 đến Phần 6 với textarea, count, button, audio -->
    </div>

    <div class="merge-section">
        <button id="mergeBtn">🧩 Ghép & Download All (1 File MP3)</button>
    </div>

    <div id="global-status"></div>

    <script>
        // Giữ nguyên phần generate riêng từng phần như bản trước (6 phần)

        // Thêm phần ghép all
        const mergeBtn = document.getElementById('mergeBtn');
        const status = document.getElementById('global-status');

        mergeBtn.addEventListener('click', async () => {
            const audioElements = [];
            for (let i = 1; i <= 6; i++) {
                const audio = document.getElementById(`audio${i}`);
                if (audio.src && audio.src.startsWith('blob:')) {
                    audioElements.push(audio);
                }
            }

            if (audioElements.length === 0) {
                updateStatus('❌ Chưa có phần nào được generate!', 'error');
                return;
            }

            updateStatus(`Đang ghép ${audioElements.length} phần thành 1 file...`, 'loading');
            mergeBtn.disabled = true;

            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const buffers = [];

                for (const audio of audioElements) {
                    const response = await fetch(audio.src);
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                    buffers.push(audioBuffer);
                }

                // Ghép buffer với crossfade nhẹ
                const totalLength = buffers.reduce((sum, buf) => sum + buf.length, 0);
                const sampleRate = buffers[0].sampleRate;
                const merged = audioContext.createBuffer(buffers[0].numberOfChannels, totalLength, sampleRate);

                let offset = 0;
                buffers.forEach((buf, index) => {
                    for (let channel = 0; channel < buf.numberOfChannels; channel++) {
                        const channelData = merged.getChannelData(channel);
                        const bufData = buf.getChannelData(channel);
                        channelData.set(bufData, offset);
                    }
                    offset += buf.length;
                });

                // Convert to Blob MP3 (gần đúng, hoặc WAV nếu cần chính xác)
                const wavBlob = bufferToWav(merged);
                const url = URL.createObjectURL(wavBlob);

                const downloadLink = document.createElement('a');
                downloadLink.href = url;
                downloadLink.download = `full-script-${Date.now()}.wav`;  // hoặc .mp3 nếu encode
                downloadLink.click();

                updateStatus(`✅ Ghép thành công ${audioElements.length} phần! Đã download file full`, 'success');

            } catch (error) {
                updateStatus('❌ Lỗi ghép file: ' + error.message, 'error');
            } finally {
                mergeBtn.disabled = false;
            }
        });

        // Hàm bufferToWav đơn giản (anh có thể dùng thư viện nếu cần MP3)
        function bufferToWav(buffer) {
            const length = buffer.length * buffer.numberOfChannels * 2 + 44;
            const arrayBuffer = new ArrayBuffer(length);
            const view = new DataView(arrayBuffer);

            // RIFF header
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + buffer.length * buffer.numberOfChannels * 2, true);
            writeString(view, 8, 'WAVE');
            // fmt subchunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, buffer.numberOfChannels, true);
            view.setUint32(24, buffer.sampleRate, true);
            view.setUint32(28, buffer.sampleRate * buffer.numberOfChannels * 2, true);
            view.setUint16(32, buffer.numberOfChannels * 2, true);
            view.setUint16(34, 16, true);
            // data subchunk
            writeString(view, 36, 'data');
            view.setUint32(40, buffer.length * buffer.numberOfChannels * 2, true);

            // Write PCM samples
            let offset = 44;
            for (let i = 0; i < buffer.length; i++) {
                for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(channel)[i]));
                    view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                    offset += 2;
                }
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function updateStatus(msg, type) {
            status.textContent = msg;
            status.className = type;
        }
    </script>
</body>
</html>
