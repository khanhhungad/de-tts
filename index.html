<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepgram TTS Pro - Multi-Part + Merge & Download All</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            min-height: 100vh; 
        }
        h1 { text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.3); margin-bottom: 10px; }
        p { text-align: center; margin-bottom: 30px; opacity: 0.9; }

        .voice-selector { text-align: center; margin-bottom: 30px; }
        .voice-selector select { padding: 12px 20px; font-size: 18px; border-radius: 10px; border: none; background: white; color: #333; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; max-width: 1400px; margin: 0 auto; }

        .part {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .part h3 { margin-top: 0; margin-bottom: 10px; text-align: center; }

        textarea { width: 100%; height: 180px; padding: 12px; font-size: 16px; border: none; border-radius: 10px; resize: vertical; background: rgba(255,255,255,0.95); color: #333; box-sizing: border-box; }

        .char-count { text-align: right; font-size: 14px; margin: 8px 0; color: #ccc; }

        button { width: 100%; padding: 14px; font-size: 17px; font-weight: bold; background: #00d4aa; color: white; border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s; }
        button:hover { background: #00b894; transform: scale(1.02); }
        button:disabled { background: #666; cursor: not-allowed; }

        .audio-section { margin-top: 15px; text-align: center; }
        audio { width: 100%; margin-top: 10px; display: none; }

        .merge-section { text-align: center; margin-top: 50px; }
        #mergeBtn { padding: 18px 60px; font-size: 20px; background: #ff6b6b; }
        #mergeBtn:hover { background: #ff5252; }
        #mergeBtn:disabled { background: #999; }

        #global-status { text-align: center; margin-top: 30px; font-size: 18px; padding: 12px; border-radius: 10px; min-height: 20px; }
        .loading { background: #ffd23f; color: #333; }
        .success { background: #00d4aa; }
        .error { background: #ff6b6b; }

        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>🚀 Deepgram TTS Pro - Multi-Part + Merge & Download All</h1>
    <p>6 phần riêng biệt • Generate từng phần • Sau đó nhấn "Ghép & Download All" để có 1 file duy nhất</p>

    <div class="voice-selector">
        <label for="global-model"><strong>Giọng nói chung cho tất cả phần:</strong></label><br><br>
        <select id="global-model">
            <option value="aura-2-thalia-en" selected>🎤 Thalia – Female (Warm, Natural)</option>
            <option value="aura-2-helena-en">🎤 Helena – Female (Friendly)</option>
            <option value="aura-2-hera-en">🎤 Hera – Female (Professional)</option>
            <option value="aura-2-orion-en">🎤 Orion – Male (Deep)</option>
            <option value="aura-2-apollo-en">🎤 Apollo – Male (Energetic)</option>
            <option value="aura-2-arcas-en">🎤 Arcas – Male (Calm)</option>
            <option value="aura-2-electra-en">🎤 Electra – Female (feminine)</option>
            <option value="aura-2-athena-en">🎤 Athena – Female (feminine)</option>
            <option value="aura-2-cora-en">🎤 Cora – Female (feminine)</option>
            <option value="aura-2-janus-en">🎤 janus – Female (feminine)</option>
            <option value="aura-2-draco-en">🎤 draco – Female (feminine)</option>
            <option value="aura-2-odysseus-en">🎤 Odysseus – Male (Classic, Deep)</option>
            <option value="aura-2-zeus-en">🎤 Zeus – Male (Powerful)</option>
        </select>
    </div>

    <div class="grid">
        <!-- Phần 1 -->
        <div class="part">
            <h3>Phần 1</h3>
            <textarea id="text1" placeholder="Dán đoạn script đầu (< 2000 ký tự)..."></textarea>
            <div class="char-count"><span id="count1">0</span>/2000 ký tự</div>
            <button id="btn1">🎙️ Generate Phần 1</button>
            <div class="audio-section"><audio id="audio1" controls></audio></div>
        </div>

        <!-- Phần 4 -->
        <div class="part">
            <h3>Phần 4</h3>
            <textarea id="text4" placeholder="Dán đoạn script thứ 4..."></textarea>
            <div class="char-count"><span id="count4">0</span>/2000 ký tự</div>
            <button id="btn4">🎙️ Generate Phần 4</button>
            <div class="audio-section"><audio id="audio4" controls></audio></div>
        </div>

        <!-- Phần 2 -->
        <div class="part">
            <h3>Phần 2</h3>
            <textarea id="text2" placeholder="Dán đoạn script thứ 2..."></textarea>
            <div class="char-count"><span id="count2">0</span>/2000 ký tự</div>
            <button id="btn2">🎙️ Generate Phần 2</button>
            <div class="audio-section"><audio id="audio2" controls></audio></div>
        </div>

        <!-- Phần 5 -->
        <div class="part">
            <h3>Phần 5</h3>
            <textarea id="text5" placeholder="Dán đoạn script thứ 5..."></textarea>
            <div class="char-count"><span id="count5">0</span>/2000 ký tự</div>
            <button id="btn5">🎙️ Generate Phần 5</button>
            <div class="audio-section"><audio id="audio5" controls></audio></div>
        </div>

        <!-- Phần 3 -->
        <div class="part">
            <h3>Phần 3</h3>
            <textarea id="text3" placeholder="Dán đoạn script thứ 3..."></textarea>
            <div class="char-count"><span id="count3">0</span>/2000 ký tự</div>
            <button id="btn3">🎙️ Generate Phần 3</button>
            <div class="audio-section"><audio id="audio3" controls></audio></div>
        </div>

        <!-- Phần 6 -->
        <div class="part">
            <h3>Phần 6</h3>
            <textarea id="text6" placeholder="Dán đoạn script cuối..."></textarea>
            <div class="char-count"><span id="count6">0</span>/2000 ký tự</div>
            <button id="btn6">🎙️ Generate Phần 6</button>
            <div class="audio-section"><audio id="audio6" controls></audio></div>
        </div>
    </div>

    <div class="merge-section">
        <button id="mergeBtn">🧩 Ghép & Download All (1 File MP3)</button>
    </div>

    <div id="global-status"></div>

    <script>
        const globalModel = document.getElementById('global-model');
        const status = document.getElementById('global-status');
        const mergeBtn = document.getElementById('mergeBtn');

        // Đếm ký tự realtime
        for (let i = 1; i <= 6; i++) {
            const textarea = document.getElementById(`text${i}`);
            const count = document.getElementById(`count${i}`);
            textarea.addEventListener('input', () => {
                const len = textarea.value.length;
                count.textContent = len;
                count.style.color = len > 2000 ? 'red' : '#ccc';
            });
        }

        // Generate riêng từng phần
        for (let i = 1; i <= 6; i++) {
            const btn = document.getElementById(`btn${i}`);
            const textarea = document.getElementById(`text${i}`);
            const audio = document.getElementById(`audio${i}`);

            btn.addEventListener('click', async () => {
                const text = textarea.value.trim();
                const model = globalModel.value;

                if (!text) {
                    updateStatus(`❌ Phần ${i}: Nhập text đi anh!`, 'error');
                    return;
                }
                if (text.length > 2000) {
                    updateStatus(`❌ Phần ${i}: Vượt 2000 ký tự!`, 'error');
                    return;
                }

                btn.disabled = true;
                btn.textContent = '⏳ Đang generate...';
                updateStatus(`Đang generate Phần ${i}...`, 'loading');

                try {
                    const response = await fetch('/api/speak', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text, model })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error || err.details || 'Lỗi không xác định');
                    }

                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);

                    audio.src = url;
                    audio.style.display = 'block';
                    audio.play();

                    updateStatus(`✅ Phần ${i} hoàn thành!`, 'success');
                } catch (error) {
                    updateStatus(`❌ Phần ${i}: ${error.message}`, 'error');
                } finally {
                    btn.disabled = false;
                    btn.textContent = `🎙️ Generate Phần ${i}`;
                }
            });
        }

        // Ghép & Download All
        mergeBtn.addEventListener('click', async () => {
            const audioElements = [];
            for (let i = 1; i <= 6; i++) {
                const audio = document.getElementById(`audio${i}`);
                if (audio.src && audio.src.startsWith('blob:')) {
                    audioElements.push(audio);
                }
            }

            if (audioElements.length === 0) {
                updateStatus('❌ Chưa generate phần nào!', 'error');
                return;
            }

            updateStatus(`Đang ghép ${audioElements.length} phần thành 1 file...`, 'loading');
            mergeBtn.disabled = true;

            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const buffers = [];

                for (const audio of audioElements) {
                    const response = await fetch(audio.src);
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                    buffers.push(audioBuffer);
                }

                // Ghép đơn giản (có thể nâng cấp crossfade sau)
                let totalLength = buffers.reduce((sum, buf) => sum + buf.length, 0);
                const merged = audioContext.createBuffer(buffers[0].numberOfChannels, totalLength, buffers[0].sampleRate);

                let offset = 0;
                buffers.forEach(buf => {
                    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
                        merged.getChannelData(ch).set(buf.getChannelData(ch), offset);
                    }
                    offset += buf.length;
                });

                // Convert to WAV blob (chất lượng cao)
                const wavBlob = bufferToWav(merged);
                const url = URL.createObjectURL(wavBlob);

                const a = document.createElement('a');
                a.href = url;
                a.download = `full-script-${Date.now()}.wav`;
                a.click();

                updateStatus(`✅ Ghép thành công ${audioElements.length} phần! Đã download file full`, 'success');
            } catch (error) {
                updateStatus('❌ Lỗi ghép: ' + error.message, 'error');
            } finally {
                mergeBtn.disabled = false;
            }
        });

        function bufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;

            const result = new ArrayBuffer(44 + buffer.length * numChannels * 2);
            const view = new DataView(result);

            // RIFF header
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + buffer.length * numChannels * 2, true);
            writeString(view, 8, 'WAVE');
            // fmt subchunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
            view.setUint16(32, numChannels * (bitDepth / 8), true);
            view.setUint16(34, bitDepth, true);
            // data subchunk
            writeString(view, 36, 'data');
            view.setUint32(40, buffer.length * numChannels * 2, true);

            // Write samples
            let offset = 44;
            for (let i = 0; i < buffer.length; i++) {
                for (let channel = 0; channel < numChannels; channel++) {
                    let sample = buffer.getChannelData(channel)[i];
                    sample = Math.max(-1, Math.min(1, sample));
                    view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                    offset += 2;
                }
            }

            return new Blob([result], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function updateStatus(msg, type) {
            status.textContent = msg;
            status.className = type;
        }
    </script>
</body>
</html>
