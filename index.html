<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepgram Aura-2 TTS Pro - Streaming (Prosody Consistent)</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 100vh; }
        h1 { color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .container { background: rgba(255,255,255,0.15); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); max-width: 900px; margin: 20px auto; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        textarea { width: 90%; height: 200px; padding: 15px; font-size: 17px; border: none; border-radius: 12px; resize: vertical; background: rgba(255,255,255,0.95); color: #333; }
        select, button { padding: 14px 20px; margin: 10px; font-size: 16px; border-radius: 10px; border: none; }
        button { background: #00d4aa; color: white; cursor: pointer; font-weight: bold; }
        button:disabled { background: #666; }
        audio { margin: 25px; width: 90%; display: none; }
        #downloadLink { display: none; font-size: 18px; padding: 12px 30px; background: #ff6b6b; color: white; text-decoration: none; border-radius: 30px; }
        #status { margin: 15px; padding: 12px; border-radius: 10px; font-weight: bold; min-height: 20px; }
        .loading { background: #ffd23f; color: #333; }
        .success { background: #00d4aa; color: white; }
        .error { background: #ff6b6b; color: white; }
        .speed-control { margin: 20px; font-size: 16px; }
        .speed-control label { display: block; margin-bottom: 10px; }
        .speed-control input { width: 80%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Deepgram Aura-2 TTS Pro - Streaming Mode</h1>
        <p>WebSocket Streaming → Giọng đều từ đầu đến cuối • Text dài 30.000+ ký tự mượt mà • Không còn choppy/prosody biến đổi</p>
        
        <textarea id="text" placeholder="Dán script dài ở đây (10.000 - 30.000 ký tự OK)...">Xin chào mọi người, đây là bản streaming WebSocket của Deepgram TTS. Giọng nói sẽ đều từ đầu đến cuối, không bị biến đổi âm lượng hay cao độ giữa các phần. Hoàn hảo cho YouTube drama Mỹ dài tập, review F&B, affiliate Amazon. Thử dán script 10.000 ký tự đi anh!</textarea>
        
        <select id="model">
            <optgroup label="🇺🇸 Top American English Voices">
                <option value="aura-2-thalia-en" selected>🎤 Thalia – Female (Warm, Natural)</option>
                <option value="aura-2-helena-en">🎤 Helena – Female (Friendly)</option>
                <option value="aura-2-hera-en">🎤 Hera – Female (Professional)</option>
                <option value="aura-2-orion-en">🎤 Orion – Male (Deep)</option>
                <option value="aura-2-apollo-en">🎤 Apollo – Male (Energetic)</option>
                <option value="aura-2-arcas-en">🎤 Arcas – Male (Calm)</option>
                <option value="aura-2-odysseus-en">🎤 Odysseus – Male (Classic, Deep – Top drama!)</option>
            </optgroup>
        </select>
        
        <div class="speed-control">
            <label>🚀 Tốc độ phát (Speed): <span id="speedValue">1.0x</span></label>
            <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
        
        <button id="generateBtn" onclick="generateSpeech()">🎙️ Generate & Stream Audio</button>
        
        <div id="status"></div>
        <audio id="audioPlayer" controls></audio>
        <br>
        <a id="downloadLink">⬇️ Download MP3 Full</a>
    </div>

    <script>
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const audioPlayer = document.getElementById('audioPlayer');

        speedSlider.addEventListener('input', () => {
            const speed = speedSlider.value;
            speedValue.textContent = speed + 'x';
            audioPlayer.playbackRate = speed;
        });

        async function generateSpeech() {
            const fullText = document.getElementById('text').value.trim();
            const model = document.getElementById('model').value;
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('status');
            const download = document.getElementById('downloadLink');

            audioPlayer.style.display = 'none';
            download.style.display = 'none';
            status.textContent = '';
            status.className = '';

            if (!fullText) {
                updateStatus('❌ Vui lòng nhập text!', 'error');
                return;
            }

            updateStatus('Đang kết nối WebSocket streaming... (giọng sẽ đều từ đầu đến cuối)', 'loading');
            btn.disabled = true;

            try {
                // Gọi proxy streaming (không chunk ở client nữa)
                const response = await fetch('/api/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: fullText, model })
                });

                if (!response.ok) {
                    const err = await response.json();
                    updateStatus(`❌ Lỗi: ${err.error || err.details || 'Unknown'}`, 'error');
                    btn.disabled = false;
                    return;
                }

                // Stream audio realtime
                const blobParts = [];
                const reader = response.body.getReader();
                const pump = async () => {
                    const { done, value } = await reader.read();
                    if (done) {
                        // Hoàn tất stream → tạo full blob để play & download
                        const fullBlob = new Blob(blobParts, { type: 'audio/wav' });
                        const url = URL.createObjectURL(fullBlob);

                        audioPlayer.src = url;
                        audioPlayer.style.display = 'block';
                        audioPlayer.playbackRate = speedSlider.value;
                        audioPlayer.play();

                        download.href = url;
                        download.download = `deepgram-streaming-${model}-${Date.now()}.wav`;
                        download.style.display = 'inline-block';

                        updateStatus('✅ Streaming hoàn tất! Giọng đều mượt từ đầu đến cuối', 'success');
                        btn.disabled = false;
                        return;
                    }
                    blobParts.push(value);
                    // Play realtime (optional - có thể thêm MediaSource cho true realtime)
                    await pump();
                };
                await pump();

            } catch (error) {
                updateStatus('❌ Lỗi kết nối: ' + error.message, 'error');
                btn.disabled = false;
            }
        }

        function updateStatus(msg, type) {
            const s = document.getElementById('status');
            s.textContent = msg;
            s.className = type;
        }

        // Ctrl + Enter shortcut
        document.getElementById('text').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                generateSpeech();
            }
        });
    </script>
</body>
</html>
